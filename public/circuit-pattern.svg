<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="circuit" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Horizontal lines -->
      <line x1="10" y1="20" x2="40" y2="20" stroke="currentColor" stroke-width="1" />
      <line x1="60" y1="20" x2="90" y2="20" stroke="currentColor" stroke-width="1" />
      <line x1="10" y1="80" x2="40" y2="80" stroke="currentColor" stroke-width="1" />
      <line x1="60" y1="80" x2="90" y2="80" stroke="currentColor" stroke-width="1" />
      
      <!-- Vertical lines -->
      <line x1="20" y1="10" x2="20" y2="40" stroke="currentColor" stroke-width="1" />
      <line x1="20" y1="60" x2="20" y2="90" stroke="currentColor" stroke-width="1" />
      <line x1="80" y1="10" x2="80" y2="40" stroke="currentColor" stroke-width="1" />
      <line x1="80" y1="60" x2="80" y2="90" stroke="currentColor" stroke-width="1" />
      
      <!-- Diagonal lines -->
      <line x1="40" y1="40" x2="60" y2="60" stroke="currentColor" stroke-width="1" />
      <line x1="60" y1="40" x2="40" y2="60" stroke="currentColor" stroke-width="1" />
      
      <!-- Connection nodes -->
      <circle cx="20" cy="20" r="2" fill="currentColor" />
      <circle cx="80" cy="20" r="2" fill="currentColor" />
      <circle cx="20" cy="80" r="2" fill="currentColor" />
      <circle cx="80" cy="80" r="2" fill="currentColor" />
      <circle cx="40" cy="40" r="1.5" fill="currentColor" />
      <circle cx="60" cy="40" r="1.5" fill="currentColor" />
      <circle cx="40" cy="60" r="1.5" fill="currentColor" />
      <circle cx="60" cy="60" r="1.5" fill="currentColor" />
      
      <!-- Small decorative elements -->
      <rect x="48" y="48" width="4" height="4" fill="currentColor" />
      <circle cx="50" cy="20" r="1" fill="currentColor" />
      <circle cx="50" cy="80" r="1" fill="currentColor" />
      <circle cx="20" cy="50" r="1" fill="currentColor" />
      <circle cx="80" cy="50" r="1" fill="currentColor" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="100" height="100" fill="url(#circuit)" />
</svg> 