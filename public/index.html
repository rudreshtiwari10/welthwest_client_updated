        <h1>WelthWest – Free AI Stock Screener, Backtesting & Market News for India</h1>
        <p>WelthWest is a free AI-powered analytics and education platform for the Indian stock market. Screen NSE and BSE stocks using AI, backtest trading strategies without writing code, track top gainers and losers, read expert market news and analysis, and learn about stock market concepts through our AI assistant — all in one place. WelthWest is not a brokerage, does not execute trades, and does not provide investment advice.</p>

        <div class="notice">
          <strong>JavaScript required for full experience.</strong> Please enable JavaScript in your browser to use the interactive platform. The summary below describes all available features.
        </div>

        <h2>AI Stock Screener for NSE and BSE</h2>
        <div class="feature-grid">
          <div class="feature-card">
            <h3><a href="/ai-screener">AI Stock Screener</a></h3>
            <p>Screen Indian stocks listed on NSE and BSE using AI-powered analysis. The screener evaluates each stock's market regime — classifying it as bull (low volatility), bull (high volatility), bear (low volatility), bear (high volatility), or sideways — based on OHLCV data and derivatives activity. Each stock receives an anomaly score highlighting unusual behaviour in price, volume, or volatility. Filter and sort by regime type, anomaly severity (critical, high, medium, low), sector, and market cap. Available in 1-day and 1-hour timeframes. Includes India VIX monitoring for overall market volatility context.</p>
          </div>
        </div>

        <h2>Top Gainers, Top Losers & Live Market Indices</h2>
        <div class="feature-grid">
          <div class="feature-card">
            <h3><a href="/stock">Stock Analysis & Market Data</a></h3>
            <p>Track today's top gaining and top losing stocks on NSE and BSE with real-time price data. View live market indices including NIFTY 50, SENSEX, Bank NIFTY, NIFTY IT, NIFTY Pharma, and more. Search any NSE/BSE listed stock to view detailed price charts, key statistics, and historical data. Explore trending stocks with percentage change, volume, and market capitalisation data.</p>
          </div>
        </div>

        <h2>No-Code Backtesting Engine</h2>
        <div class="feature-grid">
          <div class="feature-card">
            <h3><a href="/backtest">Backtest Trading Strategies — Free, No Coding Required</a></h3>
            <p>Test your trading strategies on NIFTY 50, Bank NIFTY, and 500+ individual NSE-listed stocks using 10+ years of historical OHLCV data — completely free and with no programming knowledge needed. Build strategies using technical indicators including moving average crossover (SMA, EMA), RSI (Relative Strength Index), MACD (Moving Average Convergence Divergence), Bollinger Bands, and custom indicator combinations. The engine generates comprehensive performance metrics: total return, number of trades, win rate, average win/loss, profit factor, Sharpe ratio, Sortino ratio, Calmar ratio, maximum drawdown, best/worst trade, and total profits vs losses. Results include interactive charts with entry/exit points plotted on candlestick charts alongside indicator panels. Save and compare strategy results. Past backtested performance is not indicative of future results.</p>
          </div>
        </div>

        <h2>WelthAI Assistant — Stock Market Education Chatbot</h2>
        <div class="feature-grid">
          <div class="feature-card">
            <h3><a href="/welth-ai-assistant">WelthAI Chat Assistant</a></h3>
            <p>Ask any question about the Indian stock market and finance. The WelthAI Assistant is a conversational AI chatbot that explains financial terms and concepts in simple language — from basics like "what is RSI?" and "what is MACD?" to advanced topics like market regime analysis, options Greeks, and portfolio diversification. It can discuss current market trends, explain technical indicators (RSI, MACD, moving averages, Bollinger Bands, volume analysis, support and resistance), break down financial statements, and help you understand trading strategies. The assistant provides educational information only — it does not give buy/sell recommendations, does not predict stock prices, and does not constitute financial advice.</p>
          </div>
        </div>

        <h2>AI-Powered Stock Market News & Analysis</h2>
        <div class="feature-grid">
          <div class="feature-card">
            <h3><a href="/news">Market News & Analysis</a></h3>
            <p>Daily in-depth market analysis articles by the WelthWest research team covering Indian stock market events and their real-world impact on your investments and finances. Each article includes sentiment classification (bullish, bearish, or neutral), impact assessment (high, medium, or low), affected sectors, related stock symbols, and source attribution. Coverage includes: NSE/BSE stock movements and why they happened, NIFTY and SENSEX analysis, sector-specific deep dives (IT, banking, pharma, auto, FMCG, metals, energy, real estate, defence, infrastructure), global market events and their impact on Indian stocks (US Fed rate decisions, crude oil price changes, China market movements, geopolitical tensions), RBI monetary policy decisions and their effect on bank stocks and interest rates, Union Budget analysis and its impact on different sectors, FII and DII buying/selling activity and what it means for retail investors, rupee-dollar exchange rate movements and their impact on IT and import-dependent stocks, inflation data and its effect on consumer stocks and gold, IPO listings and their market performance, quarterly earnings analysis and stock reactions, commodity price changes (gold, silver, crude oil) and their impact on related stocks, cryptocurrency market movements and their correlation with tech stocks, trade war developments and supply chain impacts on Indian manufacturing, monsoon forecasts and their effect on agricultural and FMCG stocks, and how all these events ultimately affect your portfolio and finances.</p>
          </div>
          <div class="feature-card">
            <h3><a href="/news/live">Live Financial News Feed</a></h3>
            <p>Real-time aggregated financial news from trusted Indian and global sources. Covers NSE and BSE stock movements, global market developments, IPO launches and analyses, mutual fund updates, cryptocurrency market, commodity prices, economic policy changes, and corporate earnings announcements.</p>
          </div>
          <div class="feature-card">
            <h3><a href="/blogs">Expert Financial Blogs</a></h3>
            <p>In-depth articles written on trading strategies for Indian markets, IPO analysis and reviews, mutual fund comparison and insights, Bank NIFTY and NIFTY options strategies, stock market anomaly detection guides, market regime analysis tutorials, backtesting strategy guides, finance tips,Indian economy updates and budget analysis. Categories include market analysis, investing, trading, and economy.</p>
          </div>
        </div>

        <h2>Technical Indicators & Education</h2>
        <div class="feature-grid">
          <div class="feature-card">
            <h3>Indicators Available on WelthWest</h3>
            <p>WelthWest's tools support analysis using: RSI (Relative Strength Index) — measures overbought and oversold conditions. MACD (Moving Average Convergence Divergence) — identifies trend direction and momentum. Bollinger Bands — measures price volatility and potential breakouts. SMA and EMA (Simple and Exponential Moving Averages) — smooths price data for trend identification. Volume Analysis — tracks trading volume for confirmation signals. India VIX — monitors overall market fear/greed levels. Market Regime Classification — AI-detected bull, bear, and sideways market states. Anomaly Scoring — flags unusual price, volume, or volatility behaviour.</p>
          </div>
        </div>
