    <!-- Dynamic Analytics Script - IDs loaded from environment variables -->
    <script>
      // Dynamic analytics initialization from environment variables
      (function() {
        // This will be replaced by React during build time
        // or read from environment variables at runtime
        const GA4_ID = '%REACT_APP_GA4_ID%';
        const GTM_ID = '%REACT_APP_GTM_ID%';
        
        // Only initialize if IDs are available and not placeholder values
        if (GA4_ID && GA4_ID !== '%REACT_APP_GA4_ID%') {
          console.log('🔍 Initializing GA4 from HTML fallback:', GA4_ID);
          
          // Load GA4 gtag
          const script = document.createElement('script');
          script.async = true;
          script.src = `https://www.googletagmanager.com/gtag/js?id=${GA4_ID}`;
          document.head.appendChild(script);
          
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', GA4_ID);
          
          console.log('✅ GA4 script loaded via HTML fallback');
        }
        
        if (GTM_ID && GTM_ID !== '%REACT_APP_GTM_ID%') {
          console.log('🔍 Initializing GTM from HTML fallback:', GTM_ID);
          
          // Initialize dataLayer
          window.dataLayer = window.dataLayer || [];
          window.dataLayer.push({
            'gtm.start': new Date().getTime(),
            event: 'gtm.js'
          });
          
          // Inject GTM script
          (function(w,d,s,l,i){
            w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
            var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
            j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer',GTM_ID);
          
          console.log('✅ GTM script loaded via HTML fallback');
        }
        
        // If no valid IDs found, log for debugging
        if ((!GA4_ID || GA4_ID === '%REACT_APP_GA4_ID%') && 
            (!GTM_ID || GTM_ID === '%REACT_APP_GTM_ID%')) {
          console.log('ℹ️ No analytics IDs found in HTML fallback - using React-based analytics');
        }
      })();
    </script>
    
    <script>
      // Prevent flash of unstyled content (FOUC)
      (function() {
        // Get saved theme or default to dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        // Remove any existing theme classes
        document.documentElement.classList.remove('light', 'dark');
        // Add the correct theme class
        document.documentElement.classList.add(savedTheme);
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#1a1f2e] text-gray-900 dark:text-white">
    <!-- Dynamic GTM noscript fallback -->
    <script>
      // Dynamic GTM noscript injection
      (function() {
        const GTM_ID = '%REACT_APP_GTM_ID%';
        if (GTM_ID && GTM_ID !== '%REACT_APP_GTM_ID%') {
          const noscript = document.createElement('noscript');
          const iframe = document.createElement('iframe');
          iframe.src = `https://www.googletagmanager.com/ns.html?id=${GTM_ID}`;
          iframe.height = '0';
          iframe.width = '0';
          iframe.style.display = 'none';
          iframe.style.visibility = 'hidden';
          noscript.appendChild(iframe);
          document.body.insertBefore(noscript, document.body.firstChild);
        }
      })();
    </script>
    
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
